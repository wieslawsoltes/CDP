appId: "CdpInspectorApp"
description: "Validate the V8 debugger change through mandatory preview-canvas recording and zero-failure replay"
tags:
  - "sources"
  - "v8"
  - "debugger"
  - "preview"
  - "record-replay"
---
- evalScript: "__raw_window.DataContext.Connection.DisconnectCommand.Execute(null)"
- delay: "300"
- evalScript: |
    var connection = __raw_window.DataContext.Connection;
    connection.HostAddress = "http://127.0.0.1:9222";
    connection.RefreshTargetsCommand.Execute(null);
- delay: "700"
- evalScript: "__raw_window.DataContext.Connection.ConnectCommand.Execute(null)"
- delay: "1500"
- assertTrue: "__raw_window.DataContext.Connection.IsConnected"
- runFlow: "shared/navigate_to_sources.yaml"
- assertVisible: "#btnDebuggerPause"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Simulation.SelectedZoomPreset = \"50%\""
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Simulation.ResetPan()"
- delay: "500"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.ClearCommand.Execute(null)"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.ClearRecording()"
- delay: "300"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.IsRecordVideoEnabled == true"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.IsGenerateReportEnabled == true"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.ToggleRecordCommand.Execute(null)"
- delay: "500"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.IsRecording == true"
- tapOn:
    selector: "#imgScreenshot"
    point: "126,509"
- delay: "500"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.ToggleRecordCommand.Execute(null)"
- delay: "2500"
- assertFalse: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.IsRecording == true"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.RecordedSteps.Count > 0"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.Steps.Count > 0"
- evalScript: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.PlayCommand.Execute(null)"
- delay: "8000"
- assertFalse: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.IsExecuting == true"
- assertTrue: "Array.from(((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Recorder.TestStudio.Steps).every(s => s.Status == 2)"
