appId: "CdpInspectorApp"
description: "Verify the V8 debugger Sources UI exposes runtime scripts, pause controls, call frames, scopes, evaluation, exception mode, and breakpoints"
tags:
  - "sources"
  - "v8"
  - "debugger"
---
- evalScript: "__raw_window.DataContext.Connection.DisconnectCommand.Execute(null)"
- delay: "300"
- evalScript: |
    var connection = __raw_window.DataContext.Connection;
    connection.HostAddress = "http://127.0.0.1:9222";
    connection.RefreshTargetsCommand.Execute(null);
- delay: "700"
- evalScript: "__raw_window.DataContext.Connection.ConnectCommand.Execute(null)"
- delay: "1500"
- assertTrue: "__raw_window.DataContext.Connection.IsConnected"
- runFlow: "shared/navigate_to_sources.yaml"
- assertVisible: "#btnDebuggerResume"
- assertVisible: "#btnDebuggerPause"
- assertVisible: "#btnDebuggerStepOver"
- assertVisible: "#btnDebuggerStepInto"
- assertVisible: "#btnDebuggerStepOut"
- assertVisible: "#btnDebuggerRestartFrame"
- assertVisible: "#cmbPauseOnExceptions"
- assertVisible: "#txtDebuggerExpression"
- assertVisible: "#btnDebuggerEvaluate"
- assertVisible: "#txtNewWatchExpression"
- assertVisible: "#btnAddWatchExpression"
- assertVisible: "#lstDebuggerWatches"
- assertTrue: "document.querySelector('#txtLiveEditStatus') != null"
- assertVisible: "#lstDebuggerCallFrames"
- assertVisible: "#dgDebuggerScopes"
- assertVisible: "#lstV8Breakpoints"
- assertTrue: "((CdpInspectorApp.ViewModels.MainWindowViewModel)Window.DataContext).Sources.PauseOnExceptionsStates.Count == 4"
